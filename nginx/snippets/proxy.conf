# Proxy sarlavhalari — barcha `proxy_pass` uchun umumiy.

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Django login cheklovi mijoz IP sini shu sarlavhaning oxirgi qiymatidan oladi (NUM_PROXIES=1)
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Django shu sarlavhaga qarab so'rov HTTPS ekanini biladi (SECURE_PROXY_SSL_HEADER)
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_redirect off;
proxy_buffering on;

proxy_connect_timeout 10s;
# Excel/PDF hisobotlar va 10 MB gacha fayl yuklash sekinroq bo'lishi mumkin
proxy_send_timeout    120s;
proxy_read_timeout    120s;
