# Xavfsizlik sarlavhalari.
#
# X-Frame-Options QO'YILMAGAN: Web App Telegram Web (web.telegram.org) ichida
# iframe'da ochiladi. Ramkaga solishni Next.js o'zi `Content-Security-Policy:
# frame-ancestors 'self' https://web.telegram.org` bilan cheklaydi.

# HTTPS majburiy (brauzer 1 yil eslab qoladi)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Kamera — yetkazib berish fotosi uchun, geolokatsiya — xonadon joylashuvi uchun kerak
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

server_tokens off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    image/svg+xml font/woff font/woff2;
